name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: euroleague-data-none
          restore-keys: euroleague-data-
      - run: ls data/raw && npm run build 2>&1 | tail -5 && node scripts/build.mjs --league il 2>&1 | tail -2 && node scripts/build.mjs --league lba 2>&1 | tail -2 && node probe.mjs
