name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: euroleague-data-none
          restore-keys: euroleague-data-
      - run: node scripts/fetch-acb.mjs 2026 2>&1 | tail -2 && node probe.mjs && npm run build 2>&1 | grep "Quarter box" ; for k in ec il acb bbl nbl aba vtb lba; do echo "== $k"; node scripts/build.mjs --league $k 2>&1 | grep "Quarter box"; done
