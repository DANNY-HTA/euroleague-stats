name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: euroleague-data-none
          restore-keys: euroleague-data-
      - run: tar czf data.tgz data/raw/E2026 data/raw/ISR2027 && ls -la data.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.tgz
          retention-days: 1
