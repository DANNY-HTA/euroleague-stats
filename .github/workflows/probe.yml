name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: euroleague-data-none
          restore-keys: euroleague-data-
      - run: node probe.mjs
      - run: |
          node scripts/fetch-shots.mjs E2026 && node scripts/fetch-shots.mjs U2026
          tar czf /tmp/data.tgz data/raw/E2026 data/raw/ISR2027 data/raw/U2026
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-data && git rm -rqf . && cp /tmp/data.tgz . && git add data.tgz && git commit -qm data && git push -f origin probe-data
