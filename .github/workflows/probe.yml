name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: euroleague-data-none
          restore-keys: euroleague-data-
      - run: ls data/raw && npm run build 2>&1 | tail -1 && for k in ec il lba acb bbl gr nbl aba vtb; do node scripts/build.mjs --league $k 2>&1 | tail -1; done && node scripts/build-cross.mjs && node probe.mjs
